plugins { id 'com.android.application' }
def runtimeAbi = providers.gradleProperty('runtimeAbi').orNull
def repoRoot = rootProject.projectDir.parentFile
tasks.register('bundleBackend', Exec) {
    workingDir repoRoot
    commandLine System.getProperty('os.name').toLowerCase().contains('windows') ? ['cmd', '/c', 'npm.cmd', 'run', 'build:android'] : ['npm', 'run', 'build:android']
    inputs.files(fileTree(new File(repoRoot, 'backend/src')), fileTree(new File(repoRoot, 'backend/runtime')), new File(repoRoot, 'scripts/bundle-backend.mjs'), new File(repoRoot, 'scripts/copy-runtime.mjs'), new File(repoRoot, 'package.json'), new File(repoRoot, 'package-lock.json'))
    outputs.files(file('src/main/assets/backend/server.js'), file('src/main/assets/backend/terminal_bridge.py'), file('src/main/assets/licenses/backend-third-party.txt'))
    onlyIf { new File(repoRoot, 'node_modules/esbuild').exists() }
}
if (runtimeAbi != null && !(runtimeAbi in ['arm64-v8a', 'x86_64'])) {
    throw new GradleException('runtimeAbi must be arm64-v8a or x86_64')
}
if (runtimeAbi != null) {
    tasks.register('prepareRuntimeAssets', Sync) {
        dependsOn 'bundleBackend'
        from 'src/main/assets'
        into layout.buildDirectory.dir("generated/runtimeAssets/${runtimeAbi}")
        ['arm64-v8a', 'x86_64'].findAll { it != runtimeAbi }.each { other ->
            exclude "runtime/${other}.*"
        }
    }
}
android {
    namespace 'dev.pocket.agent'
    compileSdk 35
    ndkVersion '27.2.12479018'
    externalNativeBuild { ndkBuild { path file('src/main/cpp/Android.mk') } }
    defaultConfig { applicationId 'dev.pocket.agent'; minSdk 26; targetSdk 35; versionCode 5; versionName '0.4.0' }
    defaultConfig { testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
    sourceSets.main.java.srcDir '../terminal/src/main/java'
    sourceSets.main.java.srcDir '../../third_party/artemis/helper'
    if (runtimeAbi != null) {
        defaultConfig.ndk.abiFilters.add(runtimeAbi)
        sourceSets.main.assets.setSrcDirs([layout.buildDirectory.dir("generated/runtimeAssets/${runtimeAbi}")])
    } else { defaultConfig.ndk.abiFilters.addAll(['arm64-v8a', 'x86_64']) }
    sourceSets.main.assets.srcDir '../../third_party/proot-loader/assets'
    packagingOptions { jniLibs { useLegacyPackaging true; keepDebugSymbols += ['**/*.so'] } }
}
dependencies {
    implementation 'androidx.annotation:annotation:1.9.0'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}

tasks.register('buildProotLoader', Exec) {
    onlyIf { runtimeAbi == null || runtimeAbi == 'x86_64' }
    workingDir repoRoot
    inputs.dir new File(repoRoot, 'third_party/proot-loader')
    inputs.file new File(repoRoot, 'scripts/build-proot-loader.mjs')
    outputs.file file('src/main/jniLibs/x86_64/libproot-loader.so')
    commandLine 'node', new File(repoRoot, 'scripts/build-proot-loader.mjs').absolutePath,
        new File(android.sdkDirectory, "ndk/${android.ndkVersion}").absolutePath,
        file('src/main/jniLibs/x86_64/libproot-loader.so').absolutePath
}

tasks.register('verifyPackagedRuntime') {
    dependsOn 'buildProotLoader'
    doLast {
        if (!project.hasProperty('compileOnly')) {
            if (!file('src/main/assets/backend/server.js').exists()) throw new GradleException('Generate the packaged backend with npm ci && npm run build:android, or runtime/package.py.')
            def abis = (runtimeAbi != null ? [runtimeAbi] : ['arm64-v8a', 'x86_64']).findAll { file("src/main/assets/runtime/${it}.zip").exists() }
            if (abis.empty) throw new GradleException('Run python3 runtime/package.py arm64 (or amd64) before building the standalone APK.')
            abis.each { abi ->
                ['libproot.so', 'libproot-loader.so', 'libtalloc.so', 'libandroid-shmem.so'].each { name ->
                    if (!file("src/main/jniLibs/${abi}/${name}").exists()) throw new GradleException("Missing packaged runtime library: ${abi}/${name}")
                }
            }
        }
    }
}
tasks.named('preBuild').configure { dependsOn 'verifyPackagedRuntime' }
tasks.named('preBuild').configure { dependsOn 'bundleBackend' }
tasks.named('verifyPackagedRuntime').configure { dependsOn 'bundleBackend' }
if (runtimeAbi != null) tasks.named('preBuild').configure { dependsOn 'prepareRuntimeAssets' }
