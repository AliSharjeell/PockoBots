name: Verify and build Android APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_preview:
        description: Publish an APK preview release after verification
        type: boolean
        default: false
      release_tag:
        description: New preview release tag
        type: string
        default: v0.2.0
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
  android:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            abi: arm64-v8a
          - arch: amd64
            abi: x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          cmdline-tools-version: '13114758'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: docker/setup-qemu-action@v3
      - run: sudo apt-get update && sudo apt-get install -y patchelf
      - run: python3 runtime/package.py ${{ matrix.arch }}
      - run: gradle --no-daemon :app:assembleDebug :app:lintDebug
        working-directory: android
      - name: Enable KVM for the Android runtime smoke test
        if: matrix.arch == 'amd64'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        if: matrix.arch == 'amd64'
        with:
          api-level: 34
          arch: x86_64
          disable-animations: true
          working-directory: android
          script: gradle --no-daemon :app:connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        with:
          name: pocket-agent-debug-apk-${{ matrix.abi }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-lint-report-${{ matrix.abi }}
          path: android/app/build/reports/lint-results-debug.html
  release:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_preview
    needs: [backend, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pocket-agent-debug-apk-arm64-v8a
          path: release-assets
      - name: Publish verified preview APK
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: bash scripts/publish-preview.sh release-assets/app-debug.apk
